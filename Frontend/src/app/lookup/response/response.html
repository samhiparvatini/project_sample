<section aria-labelledby="responses-heading">
  <h1 id="responses-heading" class="h3">{{ username() }}'s responses</h1>
  <div
    class="table-responsive response-table"
    tabindex="0"
    role="region"
    aria-labelledby="responses-heading"
  >
    <table class="table align-middle mb-0">
      <caption class="visually-hidden">Questions and answers for {{ username() }}</caption>
      <thead>
        <tr>
          <th scope="col">Question</th>
          <th scope="col">Answer</th>
        </tr>
      </thead>
      <tbody>
        @for (response of responses(); track $index) {
          <tr>
            <th scope="row">{{ response.question }}</th>
            <td>{{ response.answer || 'No answer provided' }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="2" class="empty-state">No responses available yet.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
