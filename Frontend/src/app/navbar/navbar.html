<nav class="app-nav" aria-label="Main navigation">
  <div class="nav-links">
    <a routerLink="/form" routerLinkActive="active" ariaCurrentWhenActive="page">survey!!</a>
    <a routerLink="/lookup" routerLinkActive="active" ariaCurrentWhenActive="page">snooping</a>
  </div>
  <div class="account-menu">
    @if (currentUser(); as user) {
      <span class="welcome">Welcome, {{ user.firstName }}</span>
    }
    <button type="button" class="logout-button" [disabled]="loggingOut()" (click)="logout()">
      {{ loggingOut() ? 'Logging out…' : 'Logout' }}
    </button>
  </div>
  @if (logoutError()) {
    <p class="text-danger mb-0" role="alert">{{ logoutError() }}</p>
  }
</nav>
